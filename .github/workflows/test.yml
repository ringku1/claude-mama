name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -W ignore tests/test_mama.py
      - name: Agent limits read this machine
        run: |
          out=$(python scripts/resources.py 6)
          echo "$out"
          echo "$out" | grep -Eq '^limit=[1-8] read_limit=6 cores=[1-9][0-9]* free_ram_gb=[0-9]+\.[0-9] '
          echo "$out" | grep -vq 'free_ram_gb=0\.0 '
      - name: Installer
        run: |
          home="$RUNNER_TEMP/home"
          mkdir -p "$home"
          HOME="$home" USERPROFILE="$home" python install.py
          HOME="$home" USERPROFILE="$home" python -c "import json,os,sys; p=os.path.join(os.path.expanduser('~'),'.claude'); s=json.load(open(os.path.join(p,'settings.json'))); assert os.path.isfile(os.path.join(p,'skills','mama','SKILL.md')); assert all('mama-hook.py' in json.dumps(s['hooks'][k]) for k in ('PreCompact','SessionStart','Stop')); print('installed ok')"

  one-line-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install, update, uninstall (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" MAMA_REPO="$GITHUB_WORKSPACE"
          mkdir -p "$HOME"
          bash install.sh
          bash install.sh | grep -q updating
          test -f "$HOME/.claude/skills/mama/SKILL.md"
          python3 -c "import json,os; s=json.load(open(os.path.expanduser('~/.claude/settings.json'))); assert all('mama-hook.py' in json.dumps(s['hooks'][k]) for k in ('PreCompact','SessionStart','Stop'))"
          bash install.sh --uninstall
          test ! -e "$HOME/.claude/skills/mama"
          python3 -c "import json,os; assert 'mama-hook' not in open(os.path.expanduser('~/.claude/settings.json')).read()"
      - name: Install, update, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'
          $env:MAMA_REPO = $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          Get-Content ./install.ps1 -Raw | Invoke-Expression
          $out = Get-Content ./install.ps1 -Raw | Invoke-Expression 6>&1 | Out-String
          if ($out -notmatch 'updating') { throw "second run did not update: $out" }
          $mama = Join-Path $env:USERPROFILE '.claude\skills\mama'
          if (-not (Test-Path (Join-Path $mama 'SKILL.md'))) { throw 'skill missing' }
          $s = Get-Content (Join-Path $env:USERPROFILE '.claude\settings.json') -Raw
          foreach ($k in 'PreCompact','SessionStart','Stop') { if ($s -notmatch $k) { throw "hook $k missing" } }
          if ($s -notmatch 'mama-hook.py') { throw 'hooks not registered' }
          $env:MAMA_UNINSTALL = 1
          Get-Content ./install.ps1 -Raw | Invoke-Expression
          if (Test-Path $mama) { throw 'skill folder not removed' }
          if ((Get-Content (Join-Path $env:USERPROFILE '.claude\settings.json') -Raw) -match 'mama-hook') { throw 'hooks not removed' }
